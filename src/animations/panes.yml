# Panes: glass panes sweep across the hotbar, then sweep back out.
#
# Each clear plays one of the enabled animations in this folder, picked at
# random. Copy this file to make your own, then run /ai reload.
# Every option is explained in README.txt, in this folder.

# Set to false to stop this animation from playing.
enabled: true

# How often it's picked, compared to the other animations' weights.
weight: 1

# The items this animation draws with. Each one gets a symbol (a letter or a
# digit) that the frames below use to place it.
items:
  W: WHITE_STAINED_GLASS_PANE

# Each frame waits 'delay' ticks after the one before it (20 ticks = 1 second).
# 'hotbar' is what's in the 9 hotbar slots, from left to right:
#   a symbol   puts that item in the slot
#   .          leaves the slot as it is (at first, the player's own item)
#   _          empties the slot
# 'hold' selects a slot (0 to 8, from the left), unless slot-switching is off
# in config.yml.
frames:
  # The panes sweep in from the left, with the selected slot just ahead...
  - delay: 0
    hotbar: 'W........'
    hold: 1
  - delay: 1
    hotbar: 'WW.......'
    hold: 2
    sounds:
      - {sound: ENTITY_DOLPHIN_EAT, volume: 1.0, pitch: 0.1}
  - delay: 1
    hotbar: 'WWW......'
    hold: 3
  - delay: 1
    hotbar: 'WWWW.....'
    hold: 4
  - delay: 1
    hotbar: 'WWWWW....'
    hold: 5
    sounds:
      - {sound: ENTITY_DOLPHIN_EAT, volume: 1.0, pitch: 0.1}
  - delay: 1
    hotbar: 'WWWWWW...'
    hold: 6
  - delay: 1
    hotbar: 'WWWWWWW..'
    hold: 7
  - delay: 1
    hotbar: 'WWWWWWWW.'
    hold: 8
    sounds:
      - {sound: ENTITY_DOLPHIN_EAT, volume: 1.0, pitch: 0.1}
  - delay: 1
    hotbar: 'WWWWWWWWW'

  # ...then back out from the right.
  - delay: 1
    hotbar: 'WWWWWWWW_'
    hold: 7
    sounds:
      - {sound: ENTITY_DOLPHIN_EAT, volume: 1.0, pitch: 0.1}
  - delay: 1
    hotbar: 'WWWWWWW__'
    hold: 6
  - delay: 1
    hotbar: 'WWWWWW___'
    hold: 5
  - delay: 1
    hotbar: 'WWWWW____'
    hold: 4
  - delay: 1
    hotbar: 'WWWW_____'
  - delay: 1
    hotbar: 'WWW______'
  - delay: 1
    hotbar: 'WW_______'
  - delay: 1
    hotbar: 'W________'
  - delay: 1
    hotbar: '_________'
    particles:
      - {particle: WITCH, count: 50, offset: [0.2, 0.2, 0.2], speed: 1}

# The finish runs after the last frame. It clears the inventory, then shows
# done-msg from config.yml.
finish:
  delay: 4
  sounds:
    - {sound: BLOCK_NOTE_BLOCK_CHIME, volume: 1.0, pitch: 2.0}
    - {sound: ENTITY_PLAYER_BURP, volume: 1.0, pitch: 0.9}
